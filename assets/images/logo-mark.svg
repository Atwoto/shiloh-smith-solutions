<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Shiloh &amp; Smith Solutions favicon</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18D7F2"/>
      <stop offset="1" stop-color="#0756C9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#39B83B"/>
      <stop offset="1" stop-color="#08751E"/>
    </linearGradient>
  </defs>

  <!-- Headset arch -->
  <path d="M22 61a42 42 0 0 1 84 0" fill="none" stroke="url(#blue)"
        stroke-width="10" stroke-linecap="round"/>
  <!-- Ear cups -->
  <path d="M15 57c0-7 5-12 12-12h5v43h-5c-7 0-12-5-12-12z" fill="url(#blue)"/>
  <path d="M96 45h5c7 0 12 5 12 12v19c0 7-5 12-12 12h-5z" fill="url(#blue)"/>
  <!-- Green inner cushions -->
  <rect x="28" y="48" width="11" height="38" rx="5.5" fill="url(#green)"/>
  <rect x="89" y="48" width="11" height="38" rx="5.5" fill="url(#green)"/>
  <!-- Sound waveform -->
  <rect x="45" y="57" width="10" height="25" rx="5" fill="url(#blue)"/>
  <rect x="59" y="39" width="10" height="49" rx="5" fill="url(#blue)"/>
  <rect x="73" y="57" width="10" height="25" rx="5" fill="url(#blue)"/>
  <!-- Microphone boom and tip -->
  <path d="M101 86c-3 15-16 24-32 24H61" fill="none" stroke="url(#blue)"
        stroke-width="7" stroke-linecap="round"/>
  <rect x="49" y="104" width="23" height="12" rx="6" fill="url(#blue)"/>
  <rect x="66" y="104" width="7" height="12" rx="3.5" fill="url(#green)"/>
</svg>
